---
- name: furiosa-llm PIP 패키지 설치
  hosts: furiosa_workers
  become: yes
  tasks:

    # ── Ubuntu 22.04 ──────────────────────────────────
    - name: python3-pip 설치 (22.04)
      apt:
        name: python3-pip
        state: present
      when: ansible_facts['distribution_version'] == '22.04'

    - name: furiosa-llm 설치 (22.04)
      pip:
        name:
          - furiosa-llm
          - urllib3<2
          - more-itertools<11.0
        extra_args: '--user'
      when: ansible_facts['distribution_version'] == '22.04'

    - name: torchvision 제거 (22.04)
      pip:
        name: torchvision
        state: absent
      when: ansible_facts['distribution_version'] == '22.04'

    - name: PATH 설정 (22.04)
      lineinfile:
        path: ~/.bashrc
        line: 'export PATH="$HOME/.local/bin:$PATH"'
        state: present
      when: ansible_facts['distribution_version'] == '22.04'

    # ── Ubuntu 24.04 ──────────────────────────────────
    - name: python3.12-venv 설치 (24.04)
      apt:
        name: python3.12-venv
        state: present
      when: ansible_facts['distribution_version'] == '24.04'

    - name: venv 생성 (24.04)
      command: python3 -m venv /home/{{ ansible_user }}/venv
      args:
        creates: /home/{{ ansible_user }}/venv
      when: ansible_facts['distribution_version'] == '24.04'

    - name: pip 업그레이드 후 패키지 설치 (24.04)
      pip:
        name:
          - pip
          - furiosa-llm
          - urllib3<2
          - more-itertools<11.0
        virtualenv: /home/{{ ansible_user }}/venv
        state: latest
      when: ansible_facts['distribution_version'] == '24.04'

    - name: torchvision 제거 (24.04)
      pip:
        name: torchvision
        state: absent
        virtualenv: /home/{{ ansible_user }}/venv
      when: ansible_facts['distribution_version'] == '24.04'

