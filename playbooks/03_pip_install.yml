---
- name: furiosa-llm PIP 패키지 설치
  hosts: furiosa_workers
  become: yes
  tasks:
    - name: python3.12-venv 설치
      apt:
        name: python3.12-venv
        state: present

    - name: venv 생성
      command: python3 -m venv /home/{{ ansible_user }}/venv
      args:
        creates: /home/{{ ansible_user }}/venv

    - name: pip, setuptools, wheel, uv 설치
      pip:
        name:
          - pip
          - setuptools
          - wheel
          - uv
        virtualenv: /home/{{ ansible_user }}/venv
        state: latest

    - name: furiosa-llm 설치
      command: >
        /home/{{ ansible_user }}/venv/bin/uv pip install
        --python /home/{{ ansible_user }}/venv/bin/python
        --torch-backend=auto
        furiosa-llm==2026.3.0

    - name: venv 소유권 변경
      file:
        path: /home/{{ ansible_user }}/venv
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        recurse: yes
